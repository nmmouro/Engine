<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ============================================================
         CONFIGURAÇÕES
    ============================================================ -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Painel Frota - Sistema de gerenciamento de frota"
    >

    <title>
        Painel Frota
    </title>


    <!-- ============================================================
         CSS
    ============================================================ -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/components.css"
    >

</head>


<body>


    <!-- ============================================================
         PÁGINA INICIAL
    ============================================================ -->

    <main
        id="app"
        class="app-container"
    >

        <!-- ========================================================
             CABEÇALHO
        ======================================================== -->

        <header class="app-header">

    <div class="app-header-logo">
        <img
            src="assets/logo.png"
            alt="Painel Frota"
            class="app-logo"
        >
    </div>


    <div class="app-header-title">

        <h1 id="app-title">
            Painel Frota
        </h1>

    </div>


    <div class="app-header-right">

        <div class="app-datetime">

            <span
                id="app-date"
                class="app-date"
            >
                00/00/0000
            </span>

            <span
                id="app-time"
                class="app-time"
            >
                00:00
            </span>

        </div>


        <button
            type="button"
            id="btn-fullscreen"
            class="btn-fullscreen"
            title="Tela cheia"
            aria-label="Tela cheia"
        >
            ⛶
        </button>

    </div>

</header>


        <!-- ========================================================
             MENU PRINCIPAL
        ======================================================== -->

        <section
            class="menu-home"
            aria-label="Menu principal"
        >


            <!-- ====================================================
                 VEÍCULOS
            ==================================================== -->

            <a
                href="./veiculos.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    🚗
                </span>

                <span
                    class="menu-card-title"
                >
                    Veículos
                </span>

                <span
                    class="menu-card-description"
                >
                    Cadastro e gerenciamento dos veículos
                </span>

            </a>


            <!-- ====================================================
                 EMPREGADOS
            ==================================================== -->

            <a
                href="./empregados.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    👤
                </span>

                <span
                    class="menu-card-title"
                >
                    Empregados
                </span>

                <span
                    class="menu-card-description"
                >
                    Cadastro e gerenciamento dos empregados
                </span>

            </a>


            <!-- ====================================================
                 LANÇAMENTOS
            ==================================================== -->

            <a
                href="./lancamentos.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    📋
                </span>

                <span
                    class="menu-card-title"
                >
                    Lançamentos
                </span>

                <span
                    class="menu-card-description"
                >
                    Controle das ocorrências e utilização dos veículos
                </span>

            </a>


            <!-- ====================================================
                 DASHBOARD
            ==================================================== -->

            <a
                href="./dashboard.html"
                class="menu-card"
            >

                <span
                    class="menu-card-icon"
                    aria-hidden="true"
                >
                    📊
                </span>

                <span
                    class="menu-card-title"
                >
                    Dashboard
                </span>

                <span
                    class="menu-card-description"
                >
                    Visão geral da frota
                </span>

            </a>


        </section>


    </main>


</body>

</html>
